  <!-- Instagram -->
  <symbol id="ds-instagram" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="2.4">
      <path d="M11 4.4h10a6.6 6.6 0 0 1 6.6 6.6v10a6.6 6.6 0 0 1-6.6 6.6H11a6.6 6.6 0 0 1-6.6-6.6V11A6.6 6.6 0 0 1 11 4.4Z"/>
      <circle cx="16" cy="16" r="5.4"/>
