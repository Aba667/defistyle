    <path d="M16 3.4a9 9 0 0 0-9 9c0 6.6 9 16.2 9 16.2s9-9.6 9-16.2a9 9 0 0 0-9-9Z" fill="currentColor"/>
    <circle cx="16" cy="12.4" r="3.4" fill="var(--ds-accent,#a6404e)"/>
